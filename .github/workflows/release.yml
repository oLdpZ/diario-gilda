# Release firmate del programmino. Parte al push di un tag vX.Y.Z (o vX.Y.Z-qualcosa,
# pubblicata come pre-release, che le app installate ignorano).
#
# Serve nel repository: segreti WEBHOOK_URL e FIRMA_KEY, variabile PUBLIC_KEY
# (da "go run ./app/cmd/firma keygen"). Vedi docs/guida-discord.md.
#
# Ogni zip contiene in cima un file VERSION (= tag senza "v"): l'app rifiuta un
# aggiornamento il cui VERSION non coincide col tag. La firma copre i byte esatti
# dello zip finale. I segreti passano solo per variabili d'ambiente dei passi che
# li usano e non vengono mai stampati.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_PKG: github.com/oLdpZ/diario-gilda/app/internal/build

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag e versione del TOC devono coincidere
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME non e' nella forma vX.Y.Z"
            exit 1
          fi
          TOC="$(sed -n 's/^## Version:[[:space:]]*//p' addon/DiarioGilda/DiarioGilda.toc | tr -d '\r' | head -n 1)"
          if [ "$TOC" != "$VERSION" ]; then
            echo "::error::addon/DiarioGilda/DiarioGilda.toc ha '## Version: $TOC' ma il tag e' $GITHUB_REF_NAME: aggiorna il TOC e rifai il tag"
            exit 1
          fi
          case "$VERSION" in *-*) PRE=true ;; *) PRE=false ;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Versione $VERSION (pre-release: $PRE)"
      - name: Segreti e variabili presenti
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          FIRMA_KEY: ${{ secrets.FIRMA_KEY }}
          PUBLIC_KEY: ${{ vars.PUBLIC_KEY }}
        run: |
          for n in WEBHOOK_URL FIRMA_KEY PUBLIC_KEY; do
            if [ -z "${!n}" ]; then
              echo "::error::$n non impostato nel repository (vedi docs/guida-discord.md)"
              exit 1
            fi
          done

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test e vet
        run: go test ./... && go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l app addon)"

  test-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installa Lua 5.1 e luarocks
        run: sudo apt-get update && sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
      - name: Installa busted e luacheck
        run: |
          sudo luarocks --lua-version=5.1 install busted
          sudo luarocks --lua-version=5.1 install luacheck
      - name: Test Lua
        run: bash scripts/test-lua.sh

  windows:
    needs: [version, test-go, test-lua]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASSET: DiarioGilda-windows-amd64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build DiarioGilda.exe
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          PUBLIC_KEY: ${{ vars.PUBLIC_KEY }}
        run: |
          mkdir -p stage out
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X $BUILD_PKG.Version=$VERSION -X $BUILD_PKG.WebhookURL=$WEBHOOK_URL -X $BUILD_PKG.PublicKey=$PUBLIC_KEY" \
            -o stage/DiarioGilda.exe ./app/cmd/diario
      - name: Zip con VERSION
        run: |
          printf '%s\n' "$VERSION" > stage/VERSION
          (cd stage && zip -q -X "../out/$ASSET" DiarioGilda.exe VERSION)
          unzip -l "out/$ASSET"
          test "$(unzip -p "out/$ASSET" VERSION)" = "$VERSION"
      - name: Firma
        env:
          FIRMA_KEY: ${{ secrets.FIRMA_KEY }}
          PUBLIC_KEY: ${{ vars.PUBLIC_KEY }}
        run: |
          go run ./app/cmd/firma sign "out/$ASSET"
          go run ./app/cmd/firma verify "out/$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  macos:
    needs: [version, test-go, test-lua]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASSET: DiarioGilda-macos.zip
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: L'icona deve usare cgo (tray.go, non tray_nocgo.go)
        run: |
          for arch in arm64 amd64; do
            files="$(GOOS=darwin GOARCH=$arch CGO_ENABLED=1 go list -f '{{.GoFiles}}' ./app/internal/desktop)"
            echo "$arch: $files"
            if ! printf '%s' "$files" | tr -d '[]' | tr ' ' '\n' | grep -x 'tray.go' >/dev/null; then
              echo "::error::per darwin/$arch il pacchetto desktop non include tray.go: la build sarebbe senza icona"
              exit 1
            fi
          done
      - name: Build arm64 e amd64 con cgo, poi universale
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          PUBLIC_KEY: ${{ vars.PUBLIC_KEY }}
        run: |
          mkdir -p bin
          LDFLAGS="-s -w -X $BUILD_PKG.Version=$VERSION -X $BUILD_PKG.WebhookURL=$WEBHOOK_URL -X $BUILD_PKG.PublicKey=$PUBLIC_KEY"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC="clang -arch arm64" \
            go build -trimpath -ldflags "$LDFLAGS" -o bin/DiarioGilda-arm64 ./app/cmd/diario
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" \
            CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" \
            go build -trimpath -ldflags "$LDFLAGS" -o bin/DiarioGilda-amd64 ./app/cmd/diario
          lipo -create -output bin/DiarioGilda bin/DiarioGilda-arm64 bin/DiarioGilda-amd64
          lipo -info bin/DiarioGilda
          lipo bin/DiarioGilda -verify_arch arm64 x86_64
      - name: Bundle DiarioGilda.app
        run: |
          APP=stage/DiarioGilda.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" out
          cp bin/DiarioGilda "$APP/Contents/MacOS/DiarioGilda"
          chmod 755 "$APP/Contents/MacOS/DiarioGilda"
          sed "s/__VERSION__/$VERSION/g" app/packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          # Icona dal PNG dell'icona di sistema, con gli strumenti di macOS (sips, iconutil).
          ICONSET="$RUNNER_TEMP/icon.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s app/internal/desktop/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) app/internal/desktop/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns -o "$APP/Contents/Resources/icon.icns" "$ICONSET"
          # Firma ad-hoc del bundle (nessun certificato): serve su Apple Silicon.
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict "$APP"
          # Il programmino rifiuta gli aggiornamenti con link simbolici.
          if [ -n "$(find "$APP" -type l)" ]; then
            echo "::error::il bundle contiene link simbolici:"
            find "$APP" -type l
            exit 1
          fi
          printf '%s\n' "$VERSION" > stage/VERSION
      - name: Zip con VERSION
        run: |
          (cd stage && zip -q -r -X "../out/$ASSET" DiarioGilda.app VERSION)
          unzip -l "out/$ASSET"
          test "$(unzip -p "out/$ASSET" VERSION)" = "$VERSION"
          unzip -l "out/$ASSET" | grep ' DiarioGilda.app/Contents/MacOS/DiarioGilda$' >/dev/null
          # zipinfo: i link simbolici hanno permessi che iniziano con "l".
          if zipinfo "out/$ASSET" | grep '^l' >/dev/null; then
            echo "::error::lo zip contiene link simbolici"
            exit 1
          fi
      - name: Firma
        env:
          FIRMA_KEY: ${{ secrets.FIRMA_KEY }}
          PUBLIC_KEY: ${{ vars.PUBLIC_KEY }}
        run: |
          go run ./app/cmd/firma sign "out/$ASSET"
          go run ./app/cmd/firma verify "out/$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  release:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Controlla gli asset
        run: |
          ls -l out
          for f in DiarioGilda-windows-amd64.zip DiarioGilda-macos.zip; do
            test -s "out/$f" && test -s "out/$f.sig"
          done
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Diario di Gilda $VERSION" --generate-notes $FLAGS \
            out/DiarioGilda-windows-amd64.zip out/DiarioGilda-windows-amd64.zip.sig \
            out/DiarioGilda-macos.zip out/DiarioGilda-macos.zip.sig
