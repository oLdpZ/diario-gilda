name: Voce del Saggio

# Ogni mattina, dopo il Cronista (07:15 ora italiana), il Saggio legge la pagina nuova e pubblica
# il video in risposta. GitHub non garantisce gli orari programmati (il 6/11 il giro delle 07:55
# non è mai partito), quindi ci prova ogni 15 minuti dalle 07:00 alle 10:45 ora italiana: se non
# c'è una pagina nuova senza video il giro finisce in pochi secondi, senza chiamare Gemini.
# Di solito però lo avvia subito il Cronista stesso, alla fine di `chiudi` (bot/cronista/avvio_saggio.py):
# il cron qui sotto resta come riserva (il 7/11 non è partito nemmeno una volta).
on:
  schedule:
    - cron: "*/15 6-9 * * *"   # 07:00–10:45 ora italiana (inverno)
  workflow_dispatch:
    inputs:
      prova:
        description: "Prova: l'ultima pagina, video in #diario-servizio"
        type: boolean
        default: true

concurrency:
  group: saggio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  narra:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Il Saggio racconta
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVA: ${{ github.event_name == 'workflow_dispatch' && inputs.prova }}
        run: |
          if [ "$PROVA" = "true" ]; then python -m bot.saggio --prova; else python -m bot.saggio; fi
