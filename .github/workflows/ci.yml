name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test e vet
        run: go test ./... && go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l app addon)"

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installa Lua 5.1 e luarocks
        run: sudo apt-get update && sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
      - name: Installa busted e luacheck
        run: |
          sudo luarocks --lua-version=5.1 install busted
          sudo luarocks --lua-version=5.1 install luacheck
      - name: Test Lua
        run: bash scripts/test-lua.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Python
        run: python -m unittest discover -s bot/tests -t .
